# Builds the DailyDally Android app (.apk) on GitHub's servers and publishes it as a Release.
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's ubuntu runner already has the Android SDK installed (ANDROID_HOME).
      - name: Install Capacitor
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: App icons from assets/icon.png
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0c0f' --iconBackgroundColorDark '#0b0c0f' --splashBackgroundColor '#0b0c0f' --splashBackgroundColorDark '#0b0c0f'
      - name: Add home-screen widgets
        run: python3 native/install.py
      - name: Copy web files into the app
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DailyDally.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DailyDally-apk
          path: DailyDally.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DailyDally build ${{ github.run_number }}
          body: Download DailyDally.apk below and open it on your tablet to install.
          files: DailyDally.apk
